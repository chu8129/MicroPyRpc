[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpc-service"
version = "0.1.0"
description = "Standalone JSON-RPC service extracted from aigc_accelerator core.utils.rpc"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "qwwang", email = "chu8129@gmail.com" }]
dependencies = [
    "requests",
]

[project.optional-dependencies]
flask = ["flask"]
sanic = ["sanic"]
tornado = ["tornado"]
zmq = ["pyzmq"]
zerorpc = ["zerorpc"]
cli = ["fire"]
all = [
    "flask",
    "sanic",
    "tornado",
    "pyzmq",
    "zerorpc",
    "fire",
]

[tool.setuptools.packages.find]
include = ["rpc*"]
